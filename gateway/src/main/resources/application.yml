server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**
        - id: identity-me
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/me/**
        - id: identity-api-keys
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api-keys/**
        - id: identity-accounts
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/accounts/**
        - id: satellite-landuse
          uri: ${SATELLITE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/landuse/**
        - id: satellite-vegetation
          uri: ${SATELLITE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/vegetation/**

orbittapi:
  jwt:
    secret: ${ORBITTAPI_JWT_SECRET:change-me-in-production-this-must-be-at-least-32-bytes-long}
    issuer: orbittapi-identity

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    br.com.orbittapi: INFO
    org.springframework.cloud.gateway: INFO
